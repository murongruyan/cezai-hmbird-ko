name: 云端编译风驰 KO

on:
  workflow_dispatch:
    inputs:
      soc:
        description: '目标 SoC（all=全部并行构建）'
        type: choice
        required: true
        default: 'all'
        options:
          - 'all'
          - 'sm8850'
          - 'sm8750'
          - 'sm8650'
          - 'mt6991'
          - 'mt6993'
      kernel_branch:
        description: '内核源码分支（留空则按 SoC 使用默认最新分支）'
        required: false
        default: ''
      localversion:
        description: '内核版本后缀（设备 uname -r 中版本号之后的部分，如 -android15-8-g...-ab...；留空则按 SoC 使用默认值）'
        required: false
        default: ''
      attach_release:
        description: '构建完成后发布到 GitHub Release'
        type: choice
        required: true
        default: 'no'
        options:
          - 'no'
          - 'yes'
      release_tag:
        description: 'Release tag（仅 attach_release=yes 时生效，留空自动 ko-<运行号>）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  setup:
    name: 生成构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 生成矩阵
        id: matrix
        env:
          SOC_INPUT: ${{ github.event.inputs.soc }}
          BRANCH_INPUT: ${{ github.event.inputs.kernel_branch }}
          LOCALVERSION_INPUT: ${{ github.event.inputs.localversion }}
        shell: python
        run: |
          import json, os
          # (soc, 内核源码镜像仓库, 默认分支, 工具链 release tag, clang zip 名, 默认 localversion)
          # localversion 取自 cctv18 构建脚本的 KERNEL_NAME（对应分支真机内核版本后缀）
          targets = [
              ("sm8850", "cctv18/android_kernel_common_oneplus_sm8850",
               "oneplus/sm8850_v_16.0.0_oneplus_15", "LLVM-Clang19-r536225", "clang-r536225",
               "-android16-5-ga8f88ad96df3-ab13929693-4k"),
              ("sm8750", "cctv18/android_kernel_common_oneplus_sm8750",
               "oneplus/sm8750_v_16.0.0_oneplus_13_6.6.89", "LLVM-Clang18-r510928", "clang-r510928",
               "-android15-8-g29d86c5fc9dd-abogki428889875-4k"),
              ("sm8650", "cctv18/android_kernel_common_oneplus_sm8650",
               "oneplus/sm8650_v_15.0.0_oneplus12_6.1.118", "LLVM-Clang18-r510928", "clang-r510928",
               ""),
              ("mt6991", "cctv18/android_kernel_oneplus_mt6991",
               "oneplus/mt6991_v_15.0.2_ace5_ultra_6.6.89", "LLVM-Clang18-r510928", "clang-r510928",
               "-android15-8-g29d86c5fc9dd-abogki428889875-4k"),
              ("mt6993", "cctv18/android_kernel_oppo_mt6993",
               "oppo/mt6993_b_16.0.0_find_x9", "LLVM-Clang19-r536225", "clang-r536225",
               "-android16-5-ge7f2a9832757-ab13799791-4k"),
          ]
          soc = os.environ["SOC_INPUT"]
          branch = os.environ["BRANCH_INPUT"].strip()
          localversion = os.environ["LOCALVERSION_INPUT"].strip()
          include = []
          for s, repo, default_branch, tag, clang_zip, default_lv in targets:
              if soc in ("all", s):
                  include.append({
                      "soc": s,
                      "repo": repo,
                      "repo_dir": repo.split("/")[-1],
                      "branch": branch or default_branch,
                      "tag": tag,
                      "clang_zip": clang_zip,
                      "localversion": localversion or default_lv,
                  })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")

  build:
    name: 编译 ${{ matrix.soc }} 风驰 KO
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORK: ${{ github.workspace }}/kernel_workspace
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libelf-dev libdw-dev bc bison flex aria2 unzip kmod

      - name: 拉取内核源码与工具链（aria2 多线程，带重试与完整性校验）
        run: |
          mkdir -p "$WORK" && cd "$WORK"
          fetch_zip() {
            # $1 = url, $2 = 输出文件名；下载后用 unzip -t 校验，失败重试 5 次
            for i in 1 2 3 4 5; do
              if aria2c -q -s16 -x16 -k1M --allow-overwrite=true "$1" -o "$2" &&
                 unzip -tq "$2" >/dev/null 2>&1; then
                return 0
              fi
              echo "下载或校验失败（第 $i 次）：$1"
              rm -f "$2"
              sleep 5
            done
            return 1
          }
          # 借鉴 cctv18 方案：aria2 16 连接拉取内核源码 zip（比 git clone 快得多）
          pids=""
          fetch_zip "https://github.com/${{ matrix.repo }}/archive/refs/heads/${{ matrix.branch }}.zip" common.zip & pids="$pids $!"
          fetch_zip "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${{ matrix.tag }}/${{ matrix.clang_zip }}.zip" clang.zip & pids="$pids $!"
          fetch_zip "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${{ matrix.tag }}/build-tools.zip" build-tools.zip & pids="$pids $!"
          fail=0
          for p in $pids; do wait "$p" || fail=1; done
          [ "$fail" = 0 ] || exit 1
          unzip -q common.zip
          unzip -q clang.zip -d clang
          unzip -q build-tools.zip -d build-tools
          rm -f common.zip clang.zip build-tools.zip
          mv "${{ matrix.repo_dir }}-"* common
          CLANG_BIN=$(dirname "$(find "$WORK/clang" -name clang -type f | head -n1)")
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "CLANG: $("$CLANG_BIN/clang" --version | head -n1)"
          ls "$WORK"

      - name: 配置内核并 prepare（只需头文件与脚本，不编整个内核）
        run: |
          cd "$WORK/common"
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          # 内核树位于本仓库工作区内，setlocalversion 会向上找到本仓库 .git 并混入
          # 无关哈希，必须禁用 AUTO；再把真机版本后缀烤进 CONFIG_LOCALVERSION，
          # 保证 vermagic 与设备内核精确匹配。
          scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO
          if [ -n "${{ matrix.localversion }}" ]; then
            scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "${{ matrix.localversion }}"
          fi
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          make O=out ARCH=arm64 LLVM=1 modules_prepare -j"$(nproc)"

      - name: 编译 hmbird.ko
        run: |
          MOD_TMP=$(mktemp -d)
          cp "${{ github.workspace }}/src/ko/hmbird.c" "$MOD_TMP/source.c"
          printf 'obj-m += hmbird.o\nhmbird-y := source.o\n' > "$MOD_TMP/Makefile"
          make -C "$WORK/common" O="$WORK/common/out" M="$MOD_TMP" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 KBUILD_MODPOST_WARN=1 modules -j"$(nproc)"
          mkdir -p "${{ github.workspace }}/dist"
          cp "$MOD_TMP/hmbird.ko" "${{ github.workspace }}/dist/hmbird_${{ matrix.soc }}.ko"

      - name: 校验并记录 vermagic
        run: |
          KO="${{ github.workspace }}/dist/hmbird_${{ matrix.soc }}.ko"
          file "$KO"
          VERMAGIC=$(modinfo "$KO" | sed -n 's/^vermagic:[[:space:]]*//p')
          echo "vermagic: $VERMAGIC"
          {
            echo "## hmbird_${{ matrix.soc }}.ko"
            echo ""
            echo "- 内核分支：\`${{ matrix.branch }}\`"
            echo "- localversion：\`${{ matrix.localversion }}\`"
            echo "- vermagic：\`$VERMAGIC\`"
            echo ""
          } > "${{ github.workspace }}/dist/notes_${{ matrix.soc }}.md"

      - name: 上传 KO 产物
        uses: actions/upload-artifact@v4
        with:
          name: hmbird-${{ matrix.soc }}
          path: |
            dist/hmbird_${{ matrix.soc }}.ko
            dist/notes_${{ matrix.soc }}.md

  release:
    name: 发布 KO Release
    needs: build
    if: ${{ always() && github.event.inputs.attach_release == 'yes' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（gh CLI 需要 git 上下文）
        uses: actions/checkout@v4

      - name: 下载全部 KO 产物
        uses: actions/download-artifact@v4
        with:
          pattern: hmbird-*
          merge-multiple: true
          path: release_ko

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="ko-${{ github.run_number }}"; fi
          cat release_ko/notes_*.md > release_notes.md
          {
            echo "构建触发：${{ github.actor }}"
            echo ""
            echo "运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_ko/hmbird_*.ko --clobber
            echo "已更新 Release $TAG"
          else
            gh release create "$TAG" release_ko/hmbird_*.ko \
              --title "$TAG 风驰 KO 云端编译产物" \
              --notes-file release_notes.md
            echo "已创建 Release $TAG"
          fi
