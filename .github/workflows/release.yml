name: 打包发布风驰 DTBO Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '新版本号（如 1.15；留空则沿用 module.prop 当前版本）'
        required: false
        default: ''
      version_code:
        description: '新 versionCode（留空则保持不变）'
        required: false
        default: ''
      changelog:
        description: '本版本更新日志（留空则使用 changelog.md）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  bump:
    name: 修改版本号并打 tag
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.version != '' || github.event.inputs.version_code != '')
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 更新 module.prop 与 changelog.md
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          VERSION_CODE_INPUT: ${{ github.event.inputs.version_code }}
          CHANGELOG_INPUT: ${{ github.event.inputs.changelog }}
        run: |
          set -euo pipefail
          VERSION=$(printf '%s' "$VERSION_INPUT" | sed 's/^[vV]//' | tr -d '[:space:]')
          CODE=$(printf '%s' "$VERSION_CODE_INPUT" | tr -d '[:space:]')
          OLD_VERSION=$(grep -m1 '^version=' module.prop | cut -d= -f2-)
          OLD_CODE=$(grep -m1 '^versionCode=' module.prop | cut -d= -f2-)
          if [ -n "$VERSION" ]; then
            sed -i "s|^version=.*|version=${VERSION}|" module.prop
            NEW_VERSION="$VERSION"
          else
            NEW_VERSION="$OLD_VERSION"
          fi
          if [ -n "$CODE" ]; then
            sed -i "s|^versionCode=.*|versionCode=${CODE}|" module.prop
            NEW_CODE="$CODE"
          else
            NEW_CODE="$OLD_CODE"
          fi
          if [ -n "$CHANGELOG_INPUT" ]; then
            {
              printf '## v%s\n\n' "$NEW_VERSION"
              printf '%s\n\n' "$CHANGELOG_INPUT"
              cat changelog.md
            } > changelog.md.tmp
            mv changelog.md.tmp changelog.md
          fi
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "NEW_CODE=$NEW_CODE" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module.prop changelog.md
          if ! git diff --cached --quiet; then
            git commit -m "release: bump to v${NEW_VERSION} (versionCode ${NEW_CODE})"
          fi

      - name: 打 tag 并推送
        run: |
          set -euo pipefail
          git tag -d "v$NEW_VERSION" 2>/dev/null || true
          git tag "v$NEW_VERSION"
          git push origin HEAD
          git push origin "refs/tags/v$NEW_VERSION"

  build:
    name: 打包纯 DTBO ZIP
    needs: bump
    if: ${{ always() && needs.bump.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 安装打包工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zip unzip

      - name: 读取版本并校验纯 DTBO 内容
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version=//p' module.prop | head -n1)
          VERSION_CODE=$(sed -n 's/^versionCode=//p' module.prop | head -n1)
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          for script in customize.sh post-fs-data.sh service.sh scripts/*.sh; do
            sh -n "$script"
          done
          test -z "$(git ls-files '*.ko')"
          test -z "$(find bin scripts -type f -iname '*process_dts*' -print -quit)"
          grep -q '^[[:space:]]*HMBIRD_AWK=/system/bin/awk$' scripts/hmbird_dtbo.sh
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: 打包模块 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/module
          cp -p module.prop customize.sh post-fs-data.sh service.sh README.md LICENSE dist/module/
          cp -a bin scripts dist/module/
          (cd dist/module && zip -q -r "../sideload-hmbird-dtbo-v${VERSION}.zip" .)
          ZIP="dist/sideload-hmbird-dtbo-v${VERSION}.zip"
          unzip -tq "$ZIP"
          test -z "$(unzip -Z1 "$ZIP" | grep -E '\.ko$' || true)"
          test -z "$(unzip -Z1 "$ZIP" | grep -F 'process_dts' || true)"
          unzip -Z1 "$ZIP" | grep -Fx 'service.sh' >/dev/null
          unzip -Z1 "$ZIP" | grep -Fx 'scripts/hmbird_dtbo.sh' >/dev/null
          sha256sum "$ZIP" | tee "${ZIP}.sha256"

      - name: 自动截取更新日志
        shell: bash
        run: |
          set -euo pipefail
          VPAT=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          if grep -q "^## v${VPAT}[[:space:]]*$" changelog.md; then
            awk -v v="^## v${VPAT}[[:space:]]*$" '
              $0 ~ v { found=1; print; next }
              found && /^## / { exit }
              found { print }
            ' changelog.md > dist/release_notes.md
          else
            PREV=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log --pretty=format:'- %s' "$PREV"..HEAD > dist/release_notes.md
            else
              git log --pretty=format:'- %s' > dist/release_notes.md
            fi
          fi

      - name: 上传 DTBO 模块产物
        uses: actions/upload-artifact@v4
        with:
          name: module-release
          path: dist/

  release:
    name: 发布 GitHub Release
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（gh CLI 需要 git 上下文）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: module-release
          path: dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls dist/sideload-hmbird-dtbo-v*.zip)
          VERSION=$(basename "$ZIP" .zip | sed 's/^sideload-hmbird-dtbo-v//')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "${ZIP}.sha256" --clobber
            echo "已更新 Release $TAG 的附件"
          else
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" \
              --title "$TAG 风驰 DTBO" \
              --notes-file dist/release_notes.md
            echo "已创建 Release $TAG"
          fi
